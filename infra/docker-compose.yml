version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: biab
      POSTGRES_PASSWORD: biab
      POSTGRES_DB: biab
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biab -d biab"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pg: {}
